  /* Same splash as the system itself (Index.html #boot + Styles .mspin), so the hand-over is seamless */
  .mspin { position: relative; width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; flex: none }

  .mspin i { position: absolute; inset: 0; border-radius: 50%; border: 4px solid rgba(26,79,143,.14); border-top-color: #1a4f8f; border-right-color: #d4a017; animation: mspin .9s linear infinite }
  .mspin.lg { width: 120px; height: 120px } .mspin.lg img { width: 84px; height: 84px }
  @keyframes mspin { to { transform: rotate(360deg) } }
  #boot { position: fixed; inset: 0; z-index: 7000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #fff; text-align: center; padding: 16px;

  #boot b { font: 700 1.35rem Inter, Arial, sans-serif; margin-top: 6px } #boot span { opacity: .8; font-size: .9rem }
